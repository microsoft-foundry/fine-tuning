name: Programmed training cookbook checks

on:
  pull_request:
    paths:
      - 'programmed_training/**'
      - '.github/workflows/programmed-training-checks.yml'
  push:
    branches: [main]
    paths:
      - 'programmed_training/**'
      - '.github/workflows/programmed-training-checks.yml'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: programmed_training
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: programmed_training/pyproject.toml
      - name: Install public SDK and test dependencies
        run: python -m pip install -e ".[test,deployment]" --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests and documentation checks
        run: python -m pytest -q --tb=short