name: Managed documentation checks

on:
  pull_request:
    paths:
      - 'managed_fine_tuning/**'
      - 'Sample_Datasets/**'
      - 'interactive_training/README.md'
      - 'interactive_training/docs/**'
      - 'interactive_training/envs/**/*.md'
      - 'interactive_training/interactive_training/recipes/**/*.md'
      - '.github/requirements-docs.txt'
      - '.github/workflows/documentation-checks.yml'
  push:
    branches: [main]
    paths:
      - 'managed_fine_tuning/**'
      - 'Sample_Datasets/**'
      - 'interactive_training/README.md'
      - 'interactive_training/docs/**'
      - 'interactive_training/envs/**/*.md'
      - 'interactive_training/interactive_training/recipes/**/*.md'
      - '.github/requirements-docs.txt'
      - '.github/workflows/documentation-checks.yml'

permissions:
  contents: read

jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt
      - name: Install offline contract test dependencies
        run: python -m pip install -r .github/requirements-docs.txt
      - name: Run managed offline contracts without cloud credentials
        working-directory: managed_fine_tuning
        run: >-
          python -m pytest -q --tb=short
          shared/tests/test_catalog.py
          shared/tests/test_code_repair_rft.py
          shared/tests/test_cookbook_contract.py
          shared/tests/test_countdown_cancellation.py
          shared/tests/test_dataset_validation.py
          shared/tests/test_config.py
          shared/tests/test_logging_naming.py
          shared/tests/test_retry.py
          shared/tests/test_manifests_operations.py
          shared/tests/test_notebook_execution.py
          02-multimodal-sft/tests
