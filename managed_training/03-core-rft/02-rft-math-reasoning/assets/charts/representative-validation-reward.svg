<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Representative math RFT validation reward</title>
  <desc id="desc">Validation mean reward increased from 0.05 in the first recorded evaluation to 0.20 in the second.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Representative validation mean reward</text>
  <line x1="90" y1="350" x2="660" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="350" stroke="#333" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#333">
    <text x="78" y="355" text-anchor="end">0.00</text>
    <text x="78" y="285" text-anchor="end">0.05</text>
    <text x="78" y="215" text-anchor="end">0.10</text>
    <text x="78" y="145" text-anchor="end">0.15</text>
    <text x="78" y="75" text-anchor="end">0.20</text>
    <text x="230" y="378" text-anchor="middle">Evaluation 1</text>
    <text x="520" y="378" text-anchor="middle">Evaluation 2</text>
  </g>
  <g stroke="#d9d9d9" stroke-width="1">
    <line x1="90" y1="280" x2="660" y2="280"/>
    <line x1="90" y1="210" x2="660" y2="210"/>
    <line x1="90" y1="140" x2="660" y2="140"/>
    <line x1="90" y1="70" x2="660" y2="70"/>
  </g>
  <polyline points="230,280 520,70" fill="none" stroke="#0078d4" stroke-width="4"/>
  <circle cx="230" cy="280" r="7" fill="#0078d4"/>
  <circle cx="520" cy="70" r="7" fill="#0078d4"/>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0078d4">
    <text x="230" y="260" text-anchor="middle">0.05</text>
    <text x="520" y="56" text-anchor="middle">0.20</text>
  </g>
  <text x="360" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Existing run evidence; not a guaranteed learning curve.</text>
</svg>
