schema_version: "1.0"
validation:
  status: partial
  scope: Static structure, notebook JSON and Python syntax, metadata, preserved dataset hashes, sanitized assets, and offline-safe paths.
  notes: Notebooks report service-produced loss or reward metrics. Executing training cells performs live operations and can incur charges. The Retail Capstone additionally verifies separately provisioned deployments and supports base-versus-fine-tuned comparisons.

demos:
  - &sft_bug
    id: sft-bug-detection
    title: "First SFT: Code Bug Detection"
    stage: 00-foundations
    status: draft
    path: 00-foundations/02-first-sft-bug-detection
    techniques: [sft, distillation]
    modalities: [text, code]
    notebooks: [{path: notebooks/demo.ipynb, role: end-to-end, performs_fine_tuning: true, sections: [prepare, train, monitor, metrics]}]
    training: {base_models: [gpt-oss-120b], teacher_models: [], evaluator_models: [], result_model: runtime-recorded}
    capabilities: [file-upload, sft, training-metrics]
    prerequisites: [foundry-project, entra-id, model-access]
    cost_tier: low
    runtime_tier: short
    validation: {status: partial, notes: "Portable notebook and dataset checks; live outcomes depend on customer model access, region, quota, and configuration."}

